<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f8f7">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>پنل مدیریت · تنظیم سرور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f9f7;--bg-2:#ffffff;--bg-3:#eef2ef;--border:#dbe4de;--accent:#13a866;--glow:rgba(19,168,102,.13);--text:#101715;--dim:#5c6b63}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Vazirmatn",sans-serif}
body{background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:var(--text)}
.card{background:var(--bg-2);border:1px solid var(--border);border-radius:18px;padding:28px 24px;max-width:420px;width:100%;box-shadow:0 8px 30px rgba(16,23,21,.06)}
h1{font-size:20px;font-weight:800;margin-bottom:6px}
p.desc{font-size:13px;color:var(--dim);margin-bottom:20px;line-height:1.9}
label{font-size:13px;font-weight:600;display:block;margin-bottom:8px}
input{width:100%;direction:ltr;text-align:left;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:15px;outline:none;transition:.2s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.row{display:flex;gap:10px;margin-top:14px}
button{flex:1;padding:12px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.save{background:var(--accent);color:#fff}
.save:hover{filter:brightness(1.08)}
.test{background:var(--bg-3);color:var(--text);border:1px solid var(--border)}
.status{margin-top:16px;font-size:13px;border-radius:10px;padding:10px 12px;display:none;line-height:1.8}
.ok{background:#e7f7ee;color:#11693f;display:block}
.err{background:#fdeceb;color:#a33333;display:block}
a.open{display:none;text-align:center;margin-top:16px;padding:12px;border-radius:12px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;font-size:14px}
p.saved{font-size:12px;color:var(--dim);margin-top:18px;line-height:1.9;word-break:break-all}
a.back{display:block;text-align:center;margin-top:12px;color:var(--dim);font-size:13px;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <h1>⚙️ آدرس سرور</h1>
  <p class="desc">آدرس سرویس ربات را وارد کن و ذخیره کن. از این به بعد پنل به همین سرور وصل می‌شود. هر وقت سرور عوض شد، همین‌جا آدرس جدید را بگذار؛ نیازی به ویرایش کد نیست.</p>
  <label for="url">آدرس سرور</label>
  <input id="url" type="url" placeholder="https://example.onrender.com" autocomplete="off" spellcheck="false">
  <div class="row">
    <button class="save" onclick="save()">ذخیره</button>
    <button class="test" onclick="test()">تست اتصال</button>
  </div>
  <div id="status" class="status"></div>
  <a class="open" id="open" href="./">باز کردن پنل</a>
  <p class="saved" id="saved"></p>
  <a class="back" href="./">بازگشت به پنل</a>
</div>
<script>
var KEY="server_url";
var el=document.getElementById("url"),st=document.getElementById("status"),
    sv=document.getElementById("saved"),op=document.getElementById("open");
function current(){try{return localStorage.getItem(KEY)||""}catch(e){return""}}
function norm(v){return (v||"").trim().replace(/\/+$/,"")}
el.value=current();
function show(cls,msg){st.className="status "+cls;st.innerHTML=msg}
function save(){
  var v=norm(el.value);
  if(!/^https?:\/\/.+\..+/.test(v)){show("err","❌ آدرس درست نیست. باید با https:// شروع شود.");return}
  try{localStorage.setItem(KEY,v)}catch(e){show("err","❌ مرورگر اجازه ذخیره نداد.");return}
  show("ok","✅ ذخیره شد. پنل به این سرور وصل می‌شود.");
  op.style.display="block";
  sv.innerHTML="ذخیره‌شده: <b>"+v+"</b>";
}
function test(){
  var v=norm(el.value)||current();
  if(!v){show("err","❌ اول آدرس را وارد کن.");return}
  show("ok","⏳ در حال بررسی سرور…");
  fetch(v+"/api/health",{credentials:"include"})
    .then(function(r){return r.json().then(function(j){return {r:r,j:j}})})
    .then(function(x){
      if(x.r.ok&&x.j.ok)show("ok","✅ سرور روشن است و پاسخ می‌دهد.");
      else show("err","⚠️ سرور جواب داد اما سلامت را تایید نکرد.");
    })
    .catch(function(){show("err","❌ اتصال برقرار نشد. سرور خامول یا آدرس غلط است.")});
}
if(current())sv.innerHTML="ذخیره‌شده: <b>"+current()+"</b>";
</script>
</body>
</html>
